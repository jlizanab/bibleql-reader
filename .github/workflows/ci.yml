name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Typecheck, unit tests, E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      # Electron always opens a real native window — there's no headless
      # mode — so E2E needs a display even in CI. Xvfb (a virtual
      # framebuffer) provides one without a physical/GPU display.
      - name: Install Xvfb + Electron's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 \
            libxss1 libxkbcommon0 libatk-bridge2.0-0 libcups2 libdrm2

      # Needs a real BIBLEQL_API_KEY: verse selection hands off real
      # passage data the editor re-fetches, which isn't covered by the
      # app's offline/no-key sample fallback (see e2e/image-creator.spec.ts).
      - name: E2E tests (Playwright + Electron)
        run: xvfb-run -a npm run test:e2e
        env:
          BIBLEQL_API_KEY: ${{ secrets.BIBLEQL_API_KEY }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
